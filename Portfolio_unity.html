<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNITY作品集導覽</title>
    <link rel="stylesheet" href="CSS/introduce.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <img src="Assets/image/index/logotest.png" alt="Logo" class="logo-img">
            <span>作品集</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">首頁</a>
            <a href="Portfolio_spine.html">關於我</a>
            <a href="Portfolio_HTML.html">網頁作品</a>
        </nav>
    </header>

    <div class="gallery-container">
        <h2 class="section-title">Unity 作品</h2>
        <div class="carousel">
            <div class="arrow" onclick="prev()">&#9664;</div>
            <div class="thumbnails" id="thumbs"></div>
            <div class="arrow" onclick="next()">&#9654;</div>
        </div>
        <div class="info-panel" id="info"></div>
    </div>

    <script>
        const data = [
            {
                title: '作品 A',
                screenshot: 'A的遊戲截圖',
                intro: '這是 A 的遊戲介紹內容。',
                dev: '這是 A 的開發介紹內容。'
            },
            {
                title: '作品 B',
                screenshot: 'B的遊戲截圖',
                intro: '這是 B 的遊戲介紹內容。',
                dev: '這是 B 的開發介紹內容。'
            },
            {
                title: '作品 C',
                screenshot: 'C的遊戲截圖',
                intro: '這是 C 的遊戲介紹內容。',
                dev: '這是 C 的開發介紹內容。'
            },
            {
                title: '作品 D',
                screenshot: 'D的遊戲截圖',
                intro: '這是 D 的遊戲介紹內容。',
                dev: '這是 D 的開發介紹內容。'
            },
            {
                title: '作品 E',
                screenshot: 'E的遊戲截圖',
                intro: '這是 E 的遊戲介紹內容。',
                dev: '這是 E 的開發介紹內容。'
            },
            
        ];

        let currentIndex = 0;

        const thumbsDiv = document.getElementById('thumbs');
        const infoPanel = document.getElementById('info');

        function renderThumbs() {
            thumbsDiv.innerHTML = '';
            data.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'thumb' + (i === currentIndex ? ' active' : '');
                div.innerText = item.title.split(' ')[1];
                div.onclick = () => select(i);
                thumbsDiv.appendChild(div);
            });
        }

        function select(index) {
            currentIndex = index;
            renderThumbs();
            const item = data[index];
            infoPanel.style.opacity = 0;
            setTimeout(() => {
                infoPanel.innerHTML = `
          <div class="info-screenshot">${item.screenshot}</div>
          <div class="info-text">
            <div class="info-title">${item.title}</div>
            <div class="info-desc">${item.intro}</div>
            <div class="info-dev">${item.dev}</div>
          </div>
        `;
                infoPanel.style.opacity = 1;
            }, 200);
        }

        function prev() {
            currentIndex = (currentIndex - 1 + data.length) % data.length;
            select(currentIndex);
        }

        function next() {
            currentIndex = (currentIndex + 1) % data.length;
            select(currentIndex);
        }

        renderThumbs();
        select(0);
    </script>
</body>

</html>
