    <div class="gallery-container">
        <h2 class="section-title">Unity製作經驗</h2>
        <div class="carousel">
            <div class="arrow" onclick="prev()">&#9664;</div>
            <div class="thumbnails" id="thumbs"></div>
            <div class="arrow" onclick="next()">&#9654;</div>
        </div>
        <div class="info-panel" id="info"></div>
    </div>

    <script>
        const data = [
            {
                title: '海島戀歌',
                screenshot: 'Assets/image/index/HeroPage_BackGroundA.png',
                thumbnail: 'Assets/image/unityInfo/ListA_logo.jpg',
                intro: '這是一款結合戀愛養成與時程管理的劇情向遊戲。<br>玩家在假期前夕造訪一座陽光、熱浪與比基尼交織的療癒系海島，與女主角展開一段浪漫的日常生活。<br>島上也潛藏著其他個性迥異的女孩等待邂逅，玩家可透過打工、釣魚、互動聊天、送禮等生活模擬行為來培養感情，同時精打細算安排每日行程，考驗時間分配的智慧與情感投入的分寸。<br>然而，隨著劇情推進，這座看似溫柔的島嶼背後將逐步揭露出驚人的秘密。<br>經歷過了重重難關的你，還有信心能夠真正突破他的心防嗎？',
                dev: '這是我在業餘時間投入最多心力的原創劇情型作品之一。從角色設定、世界觀架構、支線設計到戀愛養成機制的調整與落實，皆由我親自構思並整合。<br>在技術實作方面，我以 Unity 為基礎，建立了完整的事件觸發系統與多周目記憶管理機制，實現如「日程控管」、「關鍵事件解鎖」、「角色狀態變化」等複雜功能。<br>此外，本作也整合了簡易的時間分配系統與情緒互動觸發機制，並透過 Spine 動畫傳達角色的細膩感情變化，是一次在有限資源下挑戰劇情深度與機制整合極限的重要實驗。'
            },
            {
                title: '賽芙拉',
                screenshot: 'Assets/image/index/HeroPage_BackGroundA.png',
                thumbnail: 'Assets/image/unityInfo/ListB_logo.jpg',
                intro: '《賽芙拉》是一款融合「回合制思考」與「即時反應」的戰略動作遊戲。<br>遊戲上方設有一個持續轉動的輪盤，每當轉滿一圈即為一個回合。玩家可隨時按下空白鍵，觸發指針所指向的技能區塊。若玩家配置了召喚物，每個召喚物將額外增加一組專屬技能區，最多能在單次操作中釋放雙重技能，讓戰術操作更加多元。<br>為增加隨機與緊張感，輪盤會在每回合結束後隨機重新排列技能分佈，並限制每圈僅約 2 秒決策時間，讓玩家在高速判斷中仍需保持戰略思維。<br>關卡方面則採用 Roguelike 式爬塔設計，承襲《殺戮尖塔》風格，玩家需在有限生命與召喚物使用權中不斷取捨、替換與前進，最終抵達地圖終點。',
                dev: '本作是接替前一款企劃腰斬後，於 4 個月內急速開發完成的專案。如何在有限時間內完成概念重塑、機制整合並實現玩法落地，是最大的挑戰。<br>開發過程中，我專注於「隨機性與決策性的平衡設計」，嘗試打造一款具快節奏操作感但仍保留策略空間的回合制作品。<br>我設計並調整了輪盤技能演算法、召喚物增益系統與資源替換節奏，讓玩家能在緊湊壓力下做出關鍵決策，體驗「反應」與「思考」並存的爽感。'
            },
            {
                title: '遊戲貴族_約聘人員',
                screenshot: 'Assets/image/index/HeroPage_BackGroundA.png',
                thumbnail: 'Assets/image/unityInfo/ListC_logo.jpg',
                intro: '在這段約聘期間，我主要負責既有專案的錯誤修復與穩定性優化。<br>雖然工作性質以維護為主，但透過密集的 debug 與 code review，我在理解大型專案架構與閱讀他人程式碼方面獲得了實質成長，也逐漸建立起更穩定的除錯流程與工程紀律。<br>期間曾參與一款緊急開發的手機遊戲，需於一週內完成並上架 MVP，我負責其中的功能模組開發與邏輯整合，並協助調整 bug 迭代流程，累積了高時壓下的協作與交付經驗。',
                dev: '由於工作屬於外包約聘性質，且公司內部部分專案具保密條款，無法提供更多的畫面與程式內容，不過相關經驗可透過其已上架作品做為間接參考。<br>雖然作為約聘人員未能深入參與核心開發流程，但這段實務經歷讓我實際接觸到商業產品的開發與交付節奏，並在有限資源下培養出穩定產出的能力，成為我職涯中相當關鍵的成長里程碑'
            },
            {
                title: '羅馬生鼠鬥',
                screenshot: 'Assets/image/index/HeroPage_BackGroundA.png',
                thumbnail: 'Assets/image/unityInfo/ListD_logo.jpg',
                intro: '《羅馬生鼠鬥》是一款主打多人混戰的對戰派對遊戲。<br>玩家將扮演被貓咪丟進競技場的老鼠，在場上撿起各式道具互相投擲，試圖將其他老鼠打飛出場。<br>被擊中的老鼠會根據道具類型與當前血量受到不同程度的擊退，血量越少，擊飛越遠，形成高風險高緊張的戰局節奏！<br>一旦掉落場地邊緣，就會被貓咪吃掉直接淘汰，最終倖存者將榮登「榮譽老鼠派」，為牠那閃耀鼠生再添一筆光彩！',
                dev: '這是我在大三上學期完成的多人對戰專題作品，也是我第一次完整參與具備明確分工、日程控管與例行會議的團隊開發流程。<br>技術上，遊戲採 上帝視角產生了類似2.5D的感覺，這次的開發經驗讓我深入理解圖層遮擋、物件排序與地圖邏輯細節的處理方式。<br>整體而言，這是我第一次體會到「多人同步開發」與「系統整合協調」的實戰挑戰，也累積了寶貴的專題合作經驗。'
            },
            {
                title: '痛扁一頓',
                screenshot: 'Assets/image/index/HeroPage_BackGroundA.png',
                thumbnail: 'Assets/image/unityInfo/ListE_logo.jpg',
                intro: '這是 E 的遊戲介紹內容。',
                dev: '這是 E 的開發介紹內容。'
            },
            {
                title: '顛倒的魯普斯',
                screenshot: 'Assets/image/index/HeroPage_BackGroundA.png',
                thumbnail: 'Assets/image/unityInfo/ListF_logo.jpg',
                intro: '這是 E 的遊戲介紹內容。',
                dev: '這是 E 的開發介紹內容。'
            },
            {
                title: 'One Game Peer Week',
                screenshot: 'Assets/image/index/HeroPage_BackGroundA.png',
                thumbnail: 'Assets/image/unityInfo/ListG_logo.jpg',
                intro: '這是 E 的遊戲介紹內容。',
                dev: '這是 E 的開發介紹內容。'
            },

        ];

        let currentIndex = 0;

        const thumbsDiv = document.getElementById('thumbs');
        const infoPanel = document.getElementById('info');

        function renderThumbs() {
            thumbsDiv.innerHTML = '';
            data.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'thumb' + (i === currentIndex ? ' active' : '');

                const img = document.createElement('img');
                img.src = item.thumbnail;
                img.alt = item.title;
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';

                div.appendChild(img);
                div.onclick = () => select(i);
                thumbsDiv.appendChild(div);
            });
        }
        function select(index, isInitial = false) {

            currentIndex = index;
            renderThumbs();

            const item = data[index];

            if (isInitial) {
                infoPanel.innerHTML = `
            <div class="info-screenshot">
                <video src="${item.screenshot}" autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
            </div>
            <div class="info-text">
                <div class="info-title">${item.title}</div>
                <div class="info-desc">${item.intro}</div>
                <div class="info-dev">${item.dev}</div>
            </div>
        `;
                infoPanel.classList.add('fade-in');
                return;
            }

            infoPanel.classList.remove('fade-in');
            infoPanel.classList.add('fade-out');

            // 避免多次觸發 animationend：先清空，再重新加
            infoPanel.addEventListener('animationend', function onFadeOut(e) {
                if (e.animationName !== 'fadeOutUp') return; // ← 避免干擾
                infoPanel.removeEventListener('animationend', onFadeOut);

                infoPanel.innerHTML = `
        <div class="info-screenshot">
            <video src="${item.screenshot}" autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
        </div>
        <div class="info-text">
            <div class="info-title">${item.title}</div>
            <div class="info-desc">${item.intro}</div>
            <div class="info-dev">${item.dev}</div>
        </div>
    `;
                infoPanel.classList.remove('fade-out');
                void infoPanel.offsetWidth; // reflow 保證動畫觸發
                infoPanel.classList.add('fade-in');
            });

        }


        function prev() {
            currentIndex = (currentIndex - 1 + data.length) % data.length;
            select(currentIndex);
        }

        function next() {
            currentIndex = (currentIndex + 1) % data.length;
            select(currentIndex);
        }

        renderThumbs();
        select(0, true);
    </script>
</body>

</html>
