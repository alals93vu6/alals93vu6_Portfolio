    <script>
        const data = [
            {
                title: '關於我 / 個人特質',
                screenshot: 'Assets/image/userInfo/ListA_webM.webm',
                thumbnail: 'Assets/image/userInfo/ListA_logo.png',
                intro: '<div style="line-height: 1.8;"><p>● <strong>名字：</strong> 蘇明凱 / Markus</p><p>● <strong>生日：</strong> 2001/07/11</p><p>● <strong>學歷：</strong>南臺科技大學 多媒體與電腦娛樂科學 學士</p><p>● <strong>MBTI：</strong> INTP</p><p>● <strong>個性特質：</strong> 擅長傾聽與釐清需求，協助團隊共識整合與穩定推進、講話很斜咖。</p><p>● <strong>興趣：</strong> 玩遊戲、看電影、聽音樂、生產電子小廢物</p><p>● <strong>專長：</strong> 遊戲程式設計、HTML 和 MVC 架構、遊戲機制與世界觀設計、多媒體製作與剪輯</p><p>● <strong>擅用工具：</strong> Unity、C#、JavaScript、Spine 2D、SQL、Photoshop、Premiere 等</p></div>',
                dev: ''
            },
            {
                title: '遊戲開發專長',
                screenshot: 'Assets/image/userInfo/ListB_webM.webm',
                thumbnail: 'Assets/image/userInfo/ListB_logo.png',
                intro: '<div style="line-height: 1.8;"><p style="font-size: 18px; font-weight: bold;">程式設計</p><p>● <strong>主系統程式架構：</strong> 擅長設計可維護性高的主架構，如 精確實作模式、FSM 等管理多系統流程。</p><p>● <strong>模組化擴充開發：</strong> 依照功能獨立模組化，實作過道具系統、任務系統與背包管理等。</p><p>● <strong>特效與 API 串接：</strong> 整合 外部插件、Spine 2D Object等外掛，包裝成模組提升動畫與特效表現。</p><p style="font-size: 18px; font-weight: bold; margin-top: 1em;">遊戲機制</p><p>● <strong>遊戲機制設計：</strong> 依據主題設計玩法與規則，包含戰鬥屬性、體力條與卡牌合成等。</p><p>● <strong>難度曲線調整：</strong> 調整關卡與數值節奏，維持玩家挑戰感與遊戲流暢度。</p><p>● <strong>UI / UX 優化設計：</strong> 具備基本 UI 概念，重視操作流程與資訊清晰，能與美術有效協作。</p></div>',
                dev: ''
            },
            {
                title: '網頁與程式能力',
                screenshot: 'Assets/image/userInfo/ListC_webM.webm',
                thumbnail: 'Assets/image/userInfo/ListC_logo.png',
                intro: '<div style="line-height: 1.8;"><p style="font-size: 18px; font-weight: bold;">WEB網頁設計</p><p>● <strong>程式語言與框架：</strong> 熟悉 C#、JavaScript、HTML、CSS，能使用 ASP.NET MVC 架構進行前後端開發。</p><p>● <strong>網站開發：</strong> 具備響應式設計與互動開發能力，使用 jQuery、LINQ 提升前端與資料處理效率。</p><p>● <strong>資料庫與後端：</strong> 操作 SQL 進行資料建構與查詢，熟悉 ADO.NET 串接應用。</p><p>● <strong>其他應用：</strong> 曾使用過 Unity + C# 串接後端與 UI 開發經驗，能處理跨平台互動整合。</p></div>',
                dev: ''
            },
            {
                title: '企劃與整合經驗',
                screenshot: 'Assets/image/userInfo/ListD_webM.webm',
                thumbnail: 'Assets/image/userInfo/ListD_logo.png',
                intro: '<div style="line-height: 1.8;"><p style="font-size: 18px; font-weight: bold;">團隊企劃整合</p><p>● <strong>企劃提案與企劃書撰寫：</strong> 能根據需求快速產出企劃書與展示資料，清楚傳達核心概念。</p><p>● <strong>製作規格與 UI 設計輔助：</strong> 可使用 Photoshop 或 Figma 製作介面 Spec，協助團隊理解與執行介面需求。</p><p>● <strong>團隊溝通與文件協作：</strong> 習慣撰寫共用文件並標註需求與備註，促進成員間協作效率。</p><p>● <strong>JIRA 專案管理操作：</strong> 熟悉建立任務、設置進度看板、撰寫 QA 測試清單與錯誤回報（Issues）。</p></div>',
                dev: ''
            },
            {
                title: '動畫與影像製作經驗',
                screenshot: 'Assets/image/userInfo/ListE_webM.webm',
                thumbnail: 'Assets/image/userInfo/ListE_logo.png',
                intro: '<div style="line-height: 1.8;"><p style="font-size: 18px; font-weight: bold;">各式多媒體影像編輯</p><p>● <strong>Spine 2D 動畫導入：</strong> 能將完成的Spine動畫應用於遊戲角色與特效。</p><p>● <strong>Unity 動畫整合：</strong> 熟悉 Timeline 與 Animator 使用，可結合腳本與事件達成流程動畫效果。</p><p>● <strong>Premiere 後製剪輯：</strong> 可獨立進行影片剪輯、音效配合與字幕處理，應用於展示影片與報告素材。</p><p>● <strong>PS / ID 多媒體設計：</strong> 使用 Photoshop 進行素材修編與介面設計，InDesign 處理簡報與版面排版，協助團隊產出美術與文宣內容。</p><p>● <strong>多媒體整合與應用：</strong> 經驗涵蓋動畫、聲音、圖像與文字等素材組合，能快速製作互動式教學與展示內容。</p></div>',
                dev: ''
            },
        ];

        let currentIndex = 0;
        let scrollPosition = 0;
        let thumbWidth = 0;
        let visibleThumbs = 0;

        const thumbsDiv = document.getElementById('thumbs');
        const infoPanel = document.getElementById('info');

        function calculateLayout() {
            // 計算縮圖寬度和可見數量
            thumbWidth = window.innerWidth <= 768 ? 
                Math.min(window.innerWidth * 0.25, 120) : 100;
            visibleThumbs = Math.floor((window.innerWidth - 80) / (thumbWidth + 12)); // 12是gap
            visibleThumbs = Math.max(2, Math.min(visibleThumbs, data.length));
        }

        function renderThumbs() {
            thumbsDiv.innerHTML = '';
            data.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'thumb' + (i === currentIndex ? ' active' : '');

                const img = document.createElement('img');
                img.src = item.thumbnail;
                img.alt = item.title;
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';

                div.appendChild(img);
                div.onclick = () => select(i);
                thumbsDiv.appendChild(div);
            });
            
            // 更新滑動位置以確保選中項目可見
            updateScrollPosition();
        }

        function updateScrollPosition() {
            const thumbsContainer = document.querySelector('.thumbnails');
            if (!thumbsContainer) return;

            // 確保當前選中的縮圖在可視範圍內
            const thumbs = thumbsContainer.children;
            if (thumbs.length === 0) return;

            const thumbElement = thumbs[currentIndex];
            const containerWidth = thumbsContainer.parentElement.offsetWidth;
            const thumbRect = thumbElement.getBoundingClientRect();
            const containerRect = thumbsContainer.parentElement.getBoundingClientRect();

            // 如果選中項目不在可視範圍內，調整滾動位置
            if (thumbRect.right > containerRect.right || thumbRect.left < containerRect.left) {
                const thumbOffset = thumbElement.offsetLeft;
                const centerOffset = containerWidth / 2 - thumbElement.offsetWidth / 2;
                scrollPosition = -(thumbOffset - centerOffset);
                
                // 限制滾動範圍
                const maxScroll = -(thumbsContainer.scrollWidth - containerWidth);
                scrollPosition = Math.max(maxScroll, Math.min(0, scrollPosition));
                
                thumbsContainer.style.transform = `translateX(${scrollPosition}px)`;
            }
        }
        function select(index, isInitial = false) {

            currentIndex = index;
            renderThumbs();

            const item = data[index];

            if (isInitial) {
                infoPanel.innerHTML = `
            <div class="info-screenshot">
                <video src="${item.screenshot}" autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
            </div>
            <div class="info-text">
                <div class="info-title">${item.title}</div>
                <div class="info-desc">${item.intro}</div>
            </div>
        `;
                infoPanel.classList.add('fade-in');
                return;
            }

            infoPanel.classList.remove('fade-in');
            infoPanel.classList.add('fade-out');

            // 避免多次觸發 animationend：先清空，再重新加
            infoPanel.addEventListener('animationend', function onFadeOut(e) {
                if (e.animationName !== 'fadeOutUp') return; // ← 避免干擾
                infoPanel.removeEventListener('animationend', onFadeOut);

                infoPanel.innerHTML = `
        <div class="info-screenshot">
            <video src="${item.screenshot}" autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
        </div>
        <div class="info-text">
            <div class="info-title">${item.title}</div>
            <div class="info-desc">${item.intro}</div>
        </div>
    `;
                infoPanel.classList.remove('fade-out');
                void infoPanel.offsetWidth; // reflow 保證動畫觸發
                infoPanel.classList.add('fade-in');
            });

        }


        function prev() {
            currentIndex = (currentIndex - 1 + data.length) % data.length;
            select(currentIndex);
        }

        function next() {
            currentIndex = (currentIndex + 1) % data.length;
            select(currentIndex);
        }

        // 觸控滑動支援
        let touchStartX = 0;
        let touchEndX = 0;
        let isDragging = false;
        let startScrollPosition = 0;

        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
            startScrollPosition = scrollPosition;
            isDragging = true;
        }

        function handleTouchMove(e) {
            if (!isDragging) return;
            
            touchEndX = e.touches[0].clientX;
            const deltaX = touchEndX - touchStartX;
            const newPosition = startScrollPosition + deltaX;
            
            const thumbsContainer = document.querySelector('.thumbnails');
            if (thumbsContainer) {
                const maxScroll = -(thumbsContainer.scrollWidth - thumbsContainer.parentElement.offsetWidth);
                const boundedPosition = Math.max(maxScroll, Math.min(0, newPosition));
                thumbsContainer.style.transform = `translateX(${boundedPosition}px)`;
            }
        }

        function handleTouchEnd(e) {
            if (!isDragging) return;
            
            const deltaX = touchEndX - touchStartX;
            const threshold = 50; // 滑動閾值
            
            if (Math.abs(deltaX) > threshold) {
                if (deltaX > 0) {
                    prev(); // 向右滑動，顯示前一個
                } else {
                    next(); // 向左滑動，顯示後一個
                }
            } else {
                // 回彈到原位置
                updateScrollPosition();
            }
            
            isDragging = false;
        }

        // 初始化
        function init() {
            calculateLayout();
            renderThumbs();
            select(0, true);
            
            // 為縮圖容器添加觸控事件
            const thumbsContainer = document.querySelector('.thumbnails-container');
            if (thumbsContainer) {
                thumbsContainer.addEventListener('touchstart', handleTouchStart, {passive: true});
                thumbsContainer.addEventListener('touchmove', handleTouchMove, {passive: true});
                thumbsContainer.addEventListener('touchend', handleTouchEnd, {passive: true});
            }
            
            // 響應式更新
            window.addEventListener('resize', () => {
                calculateLayout();
                updateScrollPosition();
            });
        }

        // 等DOM加載完成後初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>

    <!-- 漢堡選單控制腳本 -->
    <script>
        function toggleMobileMenu() {
            const hamburger = document.querySelector('.hamburger-menu');
            const navLinks = document.querySelector('.nav-links');
            
            hamburger.classList.toggle('active');
            navLinks.classList.toggle('active');
        }
        
        // 點擊選單項目後關閉選單
        document.addEventListener('DOMContentLoaded', function() {
            const navLinks = document.querySelectorAll('.nav-links a');
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    const hamburger = document.querySelector('.hamburger-menu');
                    const nav = document.querySelector('.nav-links');
                    hamburger.classList.remove('active');
                    nav.classList.remove('active');
                });
            });
        });
    </script>
    
    <!-- 響應式CSS載入器已移至head中 -->
    
    <div style="display: none;">
        <video src="Assets/image/userInfo/ListA_webM.webm" preload="auto"></video>
        <video src="Assets/image/userInfo/ListB_webM.webm" preload="auto"></video>
        <video src="Assets/image/userInfo/ListC_webM.webm" preload="auto"></video>
        <video src="Assets/image/userInfo/ListD_webM.webm" preload="auto"></video>
        <video src="Assets/image/userInfo/ListE_webM.webm" preload="auto"></video>
    </div>
