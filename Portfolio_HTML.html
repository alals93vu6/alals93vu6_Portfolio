<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>網頁作品集導覽</title>
    <!-- CSS由響應式載入器動態載入 -->
    <link rel="icon" href="Assets/image/index/logotest.png" type="image/png">
    <script src="JavaScript/portfolio-css-loader.js"></script>
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <img src="Assets/image/index/logotest.png" alt="Logo" class="logo-img">
            <span>作品集</span>
        </div>
        
        <!-- 漢堡選單按鈕（手機版顯示） -->
        <button class="hamburger-menu" onclick="toggleMobileMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <!-- 導航選單 -->
        <nav class="nav-links">
            <a href="index.html?scrollTo=totalWorks">首頁</a>
            <a href="Portfolio_aubotMe.html">關於我</a>
            <a href="Portfolio_unity.html">遊戲開發</a>
        </nav>
    </header>

    <div class="gallery-container">
        <h2 class="section-title">網頁作品</h2>
        <div class="carousel">
            <div class="arrow" onclick="prev()">&#9664;</div>
            <div class="thumbnails-container">
                <div class="thumbnails" id="thumbs"></div>
            </div>
            <div class="arrow" onclick="next()">&#9654;</div>
        </div>
        <div class="info-panel" id="info"></div>
    </div>

    <script>
        const data = [
            {
                title: '"這個網頁沒有功能"',
                screenshot: 'Assets/image/htmlInfo/ListA_webM.webm',
                thumbnail: 'Assets/image/htmlInfo/ListA_logo.jpg',
                intro: '玩家將進入一個自稱「沒有功能」的網頁，實則暗藏互動與挑釁。在這片看似空白的網頁裡，玩家必須不斷嘗試點擊、干預與探索，逐步推進隱藏的關卡。<br>過程中，將與一位神秘又強勢的系統管理員產生一場場唇槍舌劍般的交鋒。<br>然而，當真相逐步揭曉、病毒的陰影浮現之時──你真的確定，你點下的每一步，都不是在走進某個陷阱嗎？<br>⚠️ 注意：此網頁遊戲僅支援PC瀏覽器，建議使用桌面版Chrome/Edge遊玩',
                dev: '這是我從 Unity 開發轉向 Web 前端的第一個作品，思鄉情懷讓我決定要挑戰看看在網頁製作遊戲！<br>在實現完整的互動流程中，我使用純 HTML、CSS 與 JavaScript 完成整個網頁結構與邏輯。<br>對我來說，這是一次從物件導向邏輯轉換為事件驅動模式的挑戰，也是我首次嘗試在沒有框架輔助下建立多關卡流程與互動機制。',
                theURL: 'https://alals93vu6.github.io/TheWebNotHaveFunction/',
            },
            {
                title: '"NGO_恩舉社工管理後台系統"',
                screenshot: 'Assets/image/htmlInfo/ListB_webM.webm',
                thumbnail: 'Assets/image/htmlInfo/ListB_logo.jpg',
                intro: '解決NGO傳統Word/Excel管理痛點的完整三角色整合平台。傳統NGO組織多以Word文件和Excel表格進行個案管理，資料分散且容易出錯，影響社工工作效率。本平台整合民眾捐贈、個案申請、活動媒合、社工管理四大核心模組，前台採用ASP.NET Core MVC架構提供直觀的使用者介面，後台使用React搭配Material-UI打造專業的圖形化管理系統。民眾可參與公益活動並捐贈物資，個案能線上申請所需資源，社工透過數據儀表板統一管理所有流程，真正實現在單一平台完成日常核心工作的目標。技術亮點包含Azure OpenAI智能助手、語音轉文字逐字稿功能、即時推播通知系統，以及完整的角色權限控制機制。前台展示網址：https://ngo-user-case.onrender.com/',
                dev: '我在這次的專題中擔任後台系統的後端API架構師與全端整合工程師。設計RESTful API架構使用.NET 9與EF Core，建立前後台共享資料庫模型，整合Azure雲端服務與第三方API，負責跨域配置與資料流優化。從零建構企業級NGO系統，也是我朝向web技術轉型的重要里程碑。',
                theURL: 'https://github.com/isandyzhang/NGO_WebAPI_Backend.git',
            }
            ,


        ];

        let currentIndex = 0;
        let scrollPosition = 0;
        let thumbWidth = 0;
        let visibleThumbs = 0;

        const thumbsDiv = document.getElementById('thumbs');
        const infoPanel = document.getElementById('info');

        function calculateLayout() {
            // 計算縮圖寬度和可見數量
            thumbWidth = window.innerWidth <= 768 ? 
                Math.min(window.innerWidth * 0.25, 120) : 100;
            visibleThumbs = Math.floor((window.innerWidth - 80) / (thumbWidth + 12)); // 12是gap
            visibleThumbs = Math.max(2, Math.min(visibleThumbs, data.length));
        }

        function renderThumbs() {
            thumbsDiv.innerHTML = '';
            data.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'thumb' + (i === currentIndex ? ' active' : '');

                const img = document.createElement('img');
                img.src = item.thumbnail;
                img.alt = item.title;
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';

                div.appendChild(img);
                div.onclick = () => select(i);
                thumbsDiv.appendChild(div);
            });
            
            // 更新滑動位置以確保選中項目可見
            updateScrollPosition();
        }

        function updateScrollPosition() {
            const thumbsContainer = document.querySelector('.thumbnails');
            if (!thumbsContainer) return;

            // 確保當前選中的縮圖在可視範圍內
            const thumbs = thumbsContainer.children;
            if (thumbs.length === 0) return;

            const thumbElement = thumbs[currentIndex];
            const containerWidth = thumbsContainer.parentElement.offsetWidth;
            const thumbRect = thumbElement.getBoundingClientRect();
            const containerRect = thumbsContainer.parentElement.getBoundingClientRect();

            // 如果選中項目不在可視範圍內，調整滾動位置
            if (thumbRect.right > containerRect.right || thumbRect.left < containerRect.left) {
                const thumbOffset = thumbElement.offsetLeft;
                const centerOffset = containerWidth / 2 - thumbElement.offsetWidth / 2;
                scrollPosition = -(thumbOffset - centerOffset);
                
                // 限制滾動範圍
                const maxScroll = -(thumbsContainer.scrollWidth - containerWidth);
                scrollPosition = Math.max(maxScroll, Math.min(0, scrollPosition));
                
                thumbsContainer.style.transform = `translateX(${scrollPosition}px)`;
            }
        }

        function select(index, isInitial = false) {

            currentIndex = index;
            renderThumbs();

            const item = data[index];

            if (isInitial) {
                // 第一次載入直接顯示內容，無動畫
                infoPanel.innerHTML = `
            <div class="info-screenshot">
                <video src="${item.screenshot}" autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover;" type="video/webm"></video>
            </div>
            <div class="info-text">
                <div class="info-title">${item.title}</div>
                <div class="info-desc">${item.intro}</div>
                <div class="info-dev">${item.dev}</div>
                </div>
                <div class="info-link">
                    <a href="${item.theURL}" target="_blank" style="color: #3ea6ff; text-decoration: underline;">🔗 點擊了解更多</a>
                    </div>`;
                infoPanel.classList.add('fade-in'); // 進場效果保留
                return;
            }

            // 點選切換才使用動畫
            infoPanel.classList.remove('fade-in');
            infoPanel.classList.add('fade-out');

            setTimeout(() => {
                infoPanel.innerHTML = `
            <div class="info-screenshot">
                <video src="${item.screenshot}" autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover;" type="video/webm"></video>
            </div>
            <div class="info-text">
                <div class="info-title">${item.title}</div>
                <div class="info-desc">${item.intro}</div>
                <div class="info-dev">${item.dev}</div>
                </div>
                <div class="info-link">
                    <a href="${item.theURL}" target="_blank" style="color: #3ea6ff; text-decoration: underline;">🔗 點擊了解更多</a>
                    </div>`;
                infoPanel.classList.remove('fade-out');
                infoPanel.classList.add('fade-in');
            }, 400);
        }


        function prev() {
            currentIndex = (currentIndex - 1 + data.length) % data.length;
            select(currentIndex);
        }

        function next() {
            currentIndex = (currentIndex + 1) % data.length;
            select(currentIndex);
        }

        // 觸控滑動支援
        let touchStartX = 0;
        let touchEndX = 0;
        let isDragging = false;
        let startScrollPosition = 0;

        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
            startScrollPosition = scrollPosition;
            isDragging = true;
        }

        function handleTouchMove(e) {
            if (!isDragging) return;
            
            touchEndX = e.touches[0].clientX;
            const deltaX = touchEndX - touchStartX;
            const newPosition = startScrollPosition + deltaX;
            
            const thumbsContainer = document.querySelector('.thumbnails');
            if (thumbsContainer) {
                const maxScroll = -(thumbsContainer.scrollWidth - thumbsContainer.parentElement.offsetWidth);
                const boundedPosition = Math.max(maxScroll, Math.min(0, newPosition));
                thumbsContainer.style.transform = `translateX(${boundedPosition}px)`;
            }
        }

        function handleTouchEnd(e) {
            if (!isDragging) return;
            
            const deltaX = touchEndX - touchStartX;
            const threshold = 50; // 滑動閾值
            
            if (Math.abs(deltaX) > threshold) {
                if (deltaX > 0) {
                    prev(); // 向右滑動，顯示前一個
                } else {
                    next(); // 向左滑動，顯示後一個
                }
            } else {
                // 回彈到原位置
                updateScrollPosition();
            }
            
            isDragging = false;
        }

        // 初始化
        function init() {
            calculateLayout();
            renderThumbs();
            select(0, true);
            
            // 為縮圖容器添加觸控事件
            const thumbsContainer = document.querySelector('.thumbnails-container');
            if (thumbsContainer) {
                thumbsContainer.addEventListener('touchstart', handleTouchStart, {passive: true});
                thumbsContainer.addEventListener('touchmove', handleTouchMove, {passive: true});
                thumbsContainer.addEventListener('touchend', handleTouchEnd, {passive: true});
            }
            
            // 響應式更新
            window.addEventListener('resize', () => {
                calculateLayout();
                updateScrollPosition();
            });
        }

        // 等DOM加載完成後初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
    <div style="display: none;">
        <video src="Assets/image/htmlInfo/ListA_webM.webm" preload="auto"></video>
        <video src="Assets/image/htmlInfo/ListB_webM.webm" preload="auto"></video>
    </div>
    <!-- 漢堡選單控制腳本 -->
    <script>
        function toggleMobileMenu() {
            const hamburger = document.querySelector('.hamburger-menu');
            const navLinks = document.querySelector('.nav-links');
            
            hamburger.classList.toggle('active');
            navLinks.classList.toggle('active');
        }
        
        // 點擊選單項目後關閉選單
        document.addEventListener('DOMContentLoaded', function() {
            const navLinks = document.querySelectorAll('.nav-links a');
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    const hamburger = document.querySelector('.hamburger-menu');
                    const nav = document.querySelector('.nav-links');
                    hamburger.classList.remove('active');
                    nav.classList.remove('active');
                });
            });
        });
    </script>
    <!-- 響應式CSS載入器已移至head中 -->
</body>

</html>
